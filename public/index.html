<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hex Harbors</title><style>
*{box-sizing:border-box}body{margin:0;background:#0c2432;color:#f7eed8;font-family:system-ui,Arial}button,select,input{font:inherit;border-radius:8px;padding:9px;border:1px solid #567;max-width:100%}button{cursor:pointer;background:#f1c46c;color:#132b37;font-weight:700}button:disabled{opacity:.4;cursor:not-allowed}input,select{background:#203d4c;color:white}#home{max-width:540px;margin:12vh auto;padding:28px;background:#193948;border-radius:18px}h1{color:#ffd782}#game{display:none}header{display:flex;align-items:center;gap:12px;padding:10px 18px;background:#142e3c;flex-wrap:wrap}main{display:flex;min-height:calc(100vh - 135px);gap:12px;padding:12px}#boardwrap{flex:1;min-width:0;background:radial-gradient(#227a9b,#10516d);border-radius:16px;overflow:hidden;display:grid;place-items:center}svg{width:100%;height:100%;max-height:78vh;touch-action:manipulation}#side{width:310px;max-height:78vh;overflow:auto;background:#193948;border-radius:14px;padding:15px}#resources{position:sticky;bottom:0;display:flex;justify-content:center;gap:18px;flex-wrap:wrap;padding:15px;background:#142e3c;font-size:18px}#score{position:fixed;left:18px;top:80px;background:#0d2938ed;border:1px solid #d5ad64;border-radius:12px;padding:12px;z-index:4;min-width:200px;cursor:move}#score h3{margin:0 0 6px}.row{padding:5px;border-bottom:1px solid #456}.mine{background:#34566a}.panel{padding:12px;margin:10px 0;border:1px solid #4c7180;border-radius:10px}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}.tiny{font-size:12px;color:#c2d4d8}.hex{stroke:#dfc995;stroke-width:3}.node{cursor:pointer}.edge{cursor:pointer}#message{color:#ffbba6}#log{font-size:12px;max-height:160px;overflow:auto}#log div{padding:4px;border-bottom:1px solid #456}@media(max-width:800px){main{flex-direction:column}#boardwrap{height:56vh;flex:none}#side{width:100%;max-height:none}#score{font-size:12px;min-width:140px;top:62px}header{font-size:14px}}
</style></head><body><section id="home"><h1>⬡ Hex Harbors</h1><p>Online multiplayer hex-trading strategy game · 2–6 players</p><input id="name" placeholder="Your name" maxlength="16"><div class="actions"><button onclick="create()">Create Room</button></div><hr><input id="code" placeholder="Room code"><button onclick="join()">Join Room</button><p id="error"></p></section><section id="game"><header><b>⬡ HEX HARBORS</b><span id="room"></span><span id="status"></span><button onclick="toggleScore()">Scoreboard</button></header><main><div id="boardwrap"><svg id="board" viewBox="-410 -365 820 730"></svg></div><aside id="side"></aside></main><div id="resources"></div><div id="score"><h3>☷ Scoreboard</h3><div id="scores"></div></div></section><script src="/socket.io/socket.io.js"></script><script>
const socket=io(),$=id=>document.getElementById(id),R=['brick','wood','wool','wheat','ore'],icons={brick:'🧱',wood:'🪵',wool:'🐑',wheat:'🌾',ore:'🪨'},colors={Red:'#e94745',Orange:'#f39b3b',Green:'#39bf72',Blue:'#4298f5',Purple:'#ad75f3',White:'#ffffff'},fill={hill:'#b86639',forest:'#1c6940',pasture:'#8ec95b',field:'#e5c154',mountain:'#89979c',desert:'#e7cb8b'};let state,me,token=localStorage.getItem('hex-token')||crypto.randomUUID();localStorage.setItem('hex-token',token);let dragging=false;
function create(){socket.emit('create',{name:$('name').value,token})}function join(){socket.emit('join',{name:$('name').value,code:$('code').value,token})}function act(type,data={}){socket.emit('act',{type,data})}socket.on('errorMessage',s=>{if(state)alert(s);else $('error').textContent=s});socket.on('kicked',()=>location.reload());socket.on('state',s=>{state=s;me=s.players.find(p=>p.id===s.you);$('home').style.display='none';$('game').style.display='block';render()});
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const button=(label,fn)=>`<button onclick="${fn}">${label}</button>`;function selectRes(id){return `<select id="${id}">${R.map(x=>`<option value="${x}">${icons[x]} ${x}</option>`).join('')}</select>`}function get(id){return $(id)?.value}
function render(){let s=state,active=s.active===s.you,p=s.players.find(x=>x.id===s.active);$('room').textContent=`Room: ${s.code}`;$('status').textContent=`${s.phase.toUpperCase()} · ${p?.name||''}${s.roll?' · 🎲 '+s.roll.n:''}`;$('resources').innerHTML=R.map(k=>`<span>${icons[k]} ${esc(k)}: <b>${me.resources[k]}</b></span>`).join('');$('scores').innerHTML=[...s.players].sort((a,b)=>score(b)-score(a)).map((x,i)=>`<div class="row ${x.id===s.you?'mine':''}"><b style="color:${colors[x.color]}">●</b> ${i+1}. ${esc(x.name)} · ${score(x)} VP <small>(${x.resourceTotal} cards: ${x.cardCount})</small></div>`).join('');let h='';if(s.phase==='lobby'){h=`<h2>Lobby (${s.players.length}/6)</h2>${s.players.map(x=>`<div class="row">${esc(x.name)} · ${x.color} ${s.isHost&&x.id!==s.you?button('Remove',`act('remove',{id:'${x.id}'})`):''}</div>`).join('')}<p>Choose color</p><select onchange="act('color',{color:this.value})">${Object.keys(colors).map(c=>`<option ${me.color===c?'selected':''} ${s.players.some(x=>x.color===c&&x.id!==s.you)?'disabled':''}>${c}</option>`).join('')}</select>${s.isHost&&s.players.length>=2?button('Start Game',"act('start')"):''}`}
else{h=`<h3>${esc(p?.name)}'s turn</h3><p class="tiny">${s.phase==='setup'?'Place '+s.setupStage+' · Round '+(s.setupStep<s.players.length?1:2):''}</p>`;if(s.phase==='preroll'&&active){h+=button('🎲 Roll Dice',"act('roll')");h+='<div class="panel"><b>Development Cards</b>'+me.cards.map(c=>`<div class="row">${esc(c.type)} ${button('Play',`playCard('${c.id}','${c.type}')`)}</div>`).join('')+'</div>'}if(s.phase==='action'&&active){h+='<div class="panel"><b>Build</b><div class="actions">'+['road','settlement','city','card'].map(k=>button(k,`act('buy',{item:'${k}'})`)).join('')+'</div><small>Road: 🧱🪵 · Settlement: 🧱🪵🐑🌾 · City: 🌾🌾🪨🪨🪨 · Card: 🐑🌾🪨</small></div>';h+=`<div class="panel"><b>Supply Trade</b><p>Give ${selectRes('give')} for ${selectRes('get')}</p>${button('Trade',"act('tradeBank',{give:get('give'),get:get('get')})")}</div>`;h+=`<div class="panel"><b>Offer Player Trade</b><p>To <select id="target">${s.players.filter(x=>x.id!==s.you).map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select></p><p>Give ${selectRes('offerGive')} <input id="giveN" type="number" value="1" min="1" style="width:65px"></p><p>Get ${selectRes('offerGet')} <input id="getN" type="number" value="1" min="1" style="width:65px"></p>${button('Send Offer',"sendOffer()")}</div>`;h+=button('End Turn',"act('pass')")}
if(s.offer?.to===s.you){let o=s.offer,from=s.players.find(x=>x.id===o.from);h+=`<div class="panel"><b>Trade offer from ${esc(from?.name)}</b><p>You give ${esc(JSON.stringify(o.get))} and receive ${esc(JSON.stringify(o.give))}</p>${button('Accept',"act('answerOffer',{accept:true})")}${button('Decline',"act('answerOffer',{accept:false})")}</div>`}if(s.phase==='discard'&&s.discard[s.you]){h+=`<div class="panel">Discard exactly ${s.discard[s.you]} resources.${R.map(k=>`<p>${icons[k]} ${k} <input id="discard-${k}" type="number" value="0" min="0" max="${me.resources[k]}" style="width:80px"></p>`).join('')}${button('Discard',"discard()")}</div>`}if(s.phase==='robberTarget'&&s.robberActor===s.you){h+='<div class="panel">Choose player to rob: '+s.players.filter(x=>x.id!==s.you).map(x=>button(x.name,`act('steal',{id:'${x.id}'})`)).join('')+'</div>'}if(s.phase==='robberMove'&&s.robberActor===s.you)h+='<p>☠ Click a different tile to move the robber.</p>';if(s.phase==='setup'&&active)h+='<p>Click a highlighted vertex or edge to place your piece.</p>';if(s.phase==='build'&&active)h+=`<p>Click a vertex or edge to place your purchased ${s.pendingBuild}.</p>`;if(s.phase==='freeRoad'&&active)h+='<p>Place your free roads.</p>';if(s.phase==='won')h+=`<h2>🎉 ${esc(s.players.find(x=>x.id===s.winner)?.name)} wins! 🎉</h2>`;h+=`<div class="panel">Last collection: ${Object.entries(me.lastGain||{}).map(([k,n])=>`${icons[k]} ${n}`).join(', ')||'None'}</div><h3>Game Log</h3><div id="log">${s.log.map(x=>`<div>${esc(x)}</div>`).join('')}</div>`}$('side').innerHTML=h;draw()}
function score(p){return Object.values(state.buildings||{}).filter(b=>b.owner===p.id).reduce((a,b)=>a+(b.type==='city'?2:1),0)+(p.playedVP||0)+(state.longest===p.id?2:0)+(state.largest===p.id?2:0)}function sendOffer(){let give={[get('offerGive')]:Number(get('giveN'))},getR={[get('offerGet')]:Number(get('getN'))};act('offer',{to:get('target'),give,get:getR})}function discard(){act('discard',{resources:Object.fromEntries(R.map(k=>[k,Number(get('discard-'+k))]))})}function playCard(id,type){let data={id};if(type==='Invention'){let a=prompt('First resource: '+R.join(', '));let b=prompt('Second resource: '+R.join(', '));data.picks=[a,b]}if(type==='Monopoly')data.resource=prompt('Resource: '+R.join(', '));act('card',data)}
function draw(){let s=state,svg=$('board');if(!s.board){svg.innerHTML='';return}let out='';for(let [i,t] of s.board.tiles.entries()){let pts=Array.from({length:6},(_,k)=>{let a=(k*60-30)*Math.PI/180;return `${t.x+55*Math.cos(a)},${t.y+55*Math.sin(a)}`}).join(' ');out+=`<polygon class="hex" points="${pts}" fill="${fill[t.type]}" onclick="act('robber',{index:${i}})"/><text x="${t.x}" y="${t.y-19}" text-anchor="middle" font-size="11" fill="#172d29">${t.type.toUpperCase()}</text>`;if(t.number){let n=t.number,dots=6-Math.abs(7-n);out+=`<circle cx="${t.x}" cy="${t.y+8}" r="19" fill="#f8eed4" stroke="#796e4d"/><text x="${t.x}" y="${t.y+9}" font-size="17" text-anchor="middle" fill="${n===6||n===8?'#d52e22':'#282621'}" font-weight="bold">${n}</text><text x="${t.x}" y="${t.y+21}" text-anchor="middle" font-size="7" fill="#333">${'●'.repeat(dots)}</text>`}if(s.robber===i)out+=`<text x="${t.x+24}" y="${t.y-9}" font-size="23" text-anchor="middle">☠️</text>`}
for(let e of Object.values(s.board.edges)){let a=s.board.vertices[e.a],b=s.board.vertices[e.b],owner=s.roads?.[e.id],color=owner?colors[s.players.find(p=>p.id===owner)?.color]:'#ffffff55';out+=`<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="${color}" stroke-width="${owner?9:4}" stroke-linecap="round" onclick="edgeClick('${e.id}')"/><line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="transparent" stroke-width="18" onclick="edgeClick('${e.id}')"/>`}
for(let v of Object.values(s.board.vertices)){let b=s.buildings?.[v.id],owner=s.players.find(p=>p.id===b?.owner),color=owner?colors[owner.color]:'#f7edd388';if(b){out+=`<rect x="${v.x-(b.type==='city'?11:8)}" y="${v.y-(b.type==='city'?11:8)}" width="${b.type==='city'?22:16}" height="${b.type==='city'?22:16}" rx="3" fill="${color}" stroke="#14252a" stroke-width="3" onclick="vertexClick('${v.id}')"/>`}else out+=`<circle cx="${v.x}" cy="${v.y}" r="5" fill="${color}" stroke="#1e4755" onclick="vertexClick('${v.id}')"/>`}
for(let port of s.board.ports){let v=s.board.vertices[port.vertex],x=v.x*1.14,y=v.y*1.14;out+=`<line x1="${v.x}" y1="${v.y}" x2="${x}" y2="${y}" stroke="#f4e5bb" stroke-width="2"/><circle cx="${x}" cy="${y}" r="16" fill="#f8e9be" stroke="#866a3b"/><text x="${x}" y="${y+4}" text-anchor="middle" font-size="11" fill="#24353a">${port.type==='any'?'3:1':'2:1'}</text>`}svg.innerHTML=out}
function vertexClick(id){let s=state;if(s.phase==='setup'&&s.active===s.you&&s.setupStage==='settlement')act('placeVertex',{id});else if(s.phase==='build'&&s.active===s.you)act('buildVertex',{id})}function edgeClick(id){let s=state;if(s.phase==='setup'&&s.active===s.you&&s.setupStage==='road')act('placeEdge',{id});else if(s.phase==='build'&&s.active===s.you)act('buildEdge',{id});else if(s.phase==='freeRoad'&&s.active===s.you)act('freeEdge',{id})}function toggleScore(){$('score').hidden=!$('score').hidden}let dragStart=null;$('score').addEventListener('pointerdown',e=>{if(e.target.tagName==='BUTTON')return;dragStart={x:e.clientX,y:e.clientY,left:$('score').offsetLeft,top:$('score').offsetTop};$('score').setPointerCapture(e.pointerId)});$('score').addEventListener('pointermove',e=>{if(!dragStart)return;$('score').style.left=dragStart.left+e.clientX-dragStart.x+'px';$('score').style.top=dragStart.top+e.clientY-dragStart.y+'px'});$('score').addEventListener('pointerup',()=>dragStart=null);
</script></body></html>
