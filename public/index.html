function renderGameLog(){
 if(!state)return;
 const selector=$('logPlayerFilter');
 const selected=selector.value||'all';
 const players=state.players||[];
 const options='<option value="all">All players</option>'+players.map(p=>`<option value="${esc(p.id)}">${esc(p.name)}</option>`).join('');
 if(selector.innerHTML!==options)selector.innerHTML=options;
 selector.value=selected==='all'||players.some(p=>p.id===selected)?selected:'all';
 const filterPlayer=players.find(p=>p.id===selector.value);
 // Match longer names first so a player named Ann cannot color part of Anna.
 const named=[...players].filter(p=>p.name).sort((a,b)=>b.name.length-a.name.length);
 const escapeRegex=v=>v.replace(/[^a-zA-Z0-9]/g, ch=>'\\'+ch);
 const expression=named.length?new RegExp('(^|[^\\p{L}\\p{N}_])('+named.map(p=>escapeRegex(p.name)).join('|')+')(?![\\p{L}\\p{N}_])','giu'):null;

 $('log').innerHTML=rows.length?rows.map((line,i)=>{
   if(!expression)return `<div>${i===0?'✦ ':''}${esc(line)}</div>`;
   let html='',pos=0;expression.lastIndex=0;
   for(const match of line.matchAll(expression)){
     const offset=match.index+match[1].length;
     html+=esc(line.slice(pos,offset));
     const player=named.find(p=>p.name.toLocaleLowerCase()===match[2].toLocaleLowerCase());
     html+=player?`<strong class="log-player-name" style="color:${colors[player.color]||'#fff'}">${esc(match[2])}</strong>`:esc(match[2]);
     pos=offset+match[2].length;
   }
   return `<div>${i===0?'✦ ':''}${html+esc(line.slice(pos))}</div>`;
 }).join(''):'<div class="log-empty">No log entries for this player yet.</div>';
}

roadCount=Object.values(s.roads||{}).filter(x=>x===s.you).length;let settlements=ownBuildings.filter(b=>b.type==='settlement').length,cities=ownBuildings.filter(b=>b.type==='city').length;$('pieceInventory').innerHTML=`<h4>🏗 Pieces Available</h4><span class="piece-shape triangle" style="--piece-color:${colors[me.color]}"></span> Settlements: ${5-settlements}/5<br><span class="piece-shape square" style="--piece-color:${colors[me.color]}"></span> Cities: ${4-cities}/4<br>━ Roads: ${15-roadCount}/15`;$('devInventory').innerHTML='<h4>🃏 Development Cards ('+me.cards.length+')</h4>'+me.cards.map(c=>`<div class="row dev-card-row"><span class="dev-card-name" tabindex="0" aria-label="${esc(c.type)}: ${esc(devDescriptions[c.type]||'')}">${esc(c.type)}<span class="dev-tooltip" role="tooltip">${esc(devDescriptions[c.type]||'')}</span></span> ${['preroll','action'].includes(s.phase)&&active&&(c.type==='Victory Point'||s.phase==='preroll')?button('Play',`playCard('${c.id}','${c.type}')`):''}</div>`).join('');let costs={road:icons.brick+icons.wood,settlement:icons.brick+icons.wood+icons.wool+icons.wheat,city:icons.wheat.repeat(2)+icons.ore.repeat(3),card:icons.wool+icons.wheat+icons.ore};$('recipeBar').innerHTML=Object.entries(costs).map(([k,v])=>`<div>${k[0].toUpperCase()+k.slice(1)} ${v}</div>`).join('');if(['preroll','action'].includes(s.phase)&&active&&score(me)>=10){$('side').insertAdjacentHTML('beforeend',`<div class="panel">${button('🏆 Declare Victory',"act('declareVictory')").replace('<button','<button class="btn-declare-victory"')}</div>`)}if(s.phase==='action'&&active){$('side').insertAdjacentHTML('beforeend',`<div class="panel"><h3>🏗 Build</h3><div class="actions">${Object.keys(costs).map(k=>button(k==='card'?'Development Card':k[0].toUpperCase()+k.slice(1),`confirmBuild('${k}')`)).join('')}</div></div>`);$('side').insertAdjacentHTML('beforeend',`<div class="end-turn-section">${button('End Turn',"act('pass')").replace('<button','<button class="btn-end-turn"')}</div>`)}d function score(p){return Object.values(state.buildings||{}).filter(b=>b.owner===p.id).reduce((a,b)=>a+(b.type==='city'?2:1),0)+(p.playedVP||0)+(state.longest===p.id?2:0)+(state.largest===p.id?2:0)}function resourceAmounts(values){return R.filter(k=>(values?.[k]||0)>0).map(k=>`${icons[k]} ×${Number(values[k])}`).join(' + ')||'None'}function sendOffer(){let give={[get('offerGive')]:Number(get('giveN'))},getR={[get('offerGet')]:Number(get('getN'))};act('offer',{to:get('target'),give,get:getR})}function discard(){act('discard',{resources:Object.fromEntries(R.map(k=>[k,Number(get('discard-'+k))]))})}function playCard(id,type){if(type!=='Monopoly'&&type!=='Invention'){act('card',{id});return}const overlay=document.createElement('div');overlay.className='resource-modal';overlay.innerHTML=`<div class="resource-dialog" role="dialog" aria-modal="true"><h2>${type}</h2><div class="resource-modal-content"></div><div class="resource-modal-buttons"></div></div>`;document.body.append(overlay);const content=overlay.querySelector('.resource-modal-content'),buttons=overlay.querySelector('.resource-modal-buttons');const renderPick=()=>{content.innerHTML=(type==='Monopoly'?'<p>Choose a resource to take from all other players.</p>': '<p>Choose two resources to generate.</p>')+(type==='Monopoly'?'<label>Resource '+selectRes('cardPick1')+'</label>':'<label>RESOURCE 1 '+selectRes('cardPick1')+'</label><label>RESOURCE 2 '+selectRes('cardPick2')+'</label>');buttons.innerHTML='<button type="button" id="cardSelect">Select</button><button type="button" id="cardClose">Cancel</button>';$('cardClose').onclick=()=>overlay.remove();$('cardSelect').onclick=()=>{const a=get('cardPick1'),b=type==='Invention'?get('cardPick2'):null;const names=type==='Monopoly'?`everyone’s ${a}`:`${a} and ${b}`;content.innerHTML=`<p>Are you sure you want to ${type==='Monopoly'?'take':'generate'} ${esc(names)}?</p>`;buttons.innerHTML='<button class="btn-confirm" id="cardConfirm">CONFIRM</button><button class="btn-cancel" id="cardCancel">CANCEL</button>';$('cardCancel').onclick=renderPick;$('cardConfirm').onclick=()=>{act('card',type==='Monopoly'?{id,resource:a}:{id,picks:[a,b]});overlay.remove()}}};renderPick();overlay.addEventListener('click',e=>{if(e.target===overlay)overlay.remove()})}

<pattern id="mountainTex" width="42" height="34" patternUnits="userSpaceOnUse"><path d="M-8 32L9 5l16 27M9 32L27 0l19 32" fill="#667980" stroke="#b4c3c0" stroke-width="2"/><path d="M3 15l6-10 7 12-7-3zM21 12l6-12 8 15-8-5z" fill="#e3e9e4"/></pattern>

for(let e of Object.values(s.board.edges)){let a=s.board.vertices[e.a],b=s.board.vertices[e.b],owner=s.roads?.[e.id],color=owner?colors[s.players.find(p=>p.id===owner)?.color]:'#ffffff55';out+=`<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="${color}" stroke-width="${owner?9:4}" stroke-linecap="round" onclick="edgeClick('${e.id}')"/><line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="transparent" stroke-width="18" onclick="edgeClick('${e.id}')"/>`}
for(let v of Object.values(s.board.vertices)){let b=s.buildings?.[v.id],owner=s.players.find(p=>p.id===b?.owner),color=owner?colors[owner.color]:'#f7edd388';if(b&&b.type==='settlement'){out+=`<polygon points="${v.x},${v.y-10} ${v.x-9},${v.y+8} ${v.x+9},${v.y+8}" fill="${color}" stroke="#14252a" stroke-width="3" onclick="vertexClick('${v.id}')"/>`}else if(b){out+=`<rect x="${v.x-(b.type==='city'?11:8)}" y="${v.y-(b.type==='city'?11:8)}" width="${b.type==='city'?22:16}" height="${b.type==='city'?22:16}" rx="3" fill="${color}" stroke="#14252a" stroke-width="3" onclick="vertexClick('${v.id}')"/>`}else out+=`<circle cx="${v.x}" cy="${v.y}" r="5" fill="${color}" stroke="#1e4755" onclick="vertexClick('${v.id}')"/>`}
for(let port of s.board.ports){let v=s.board.vertices[port.vertex],radius=Math.hypot(v.x,v.y)||1,x=v.x+v.x/radius*33,y=v.y+v.y/radius*33,mark=port.type==='any'?'⚓':'';out+=`<line x1="${v.x}" y1="${v.y}" x2="${x}" y2="${y}" stroke="#f8e9be" stroke-width="2" stroke-dasharray="4 3"/><g transform="translate(${x},${y})"><path d="M-24 1 L24 1 L15 15 L-15 15 Z" fill="#7a4b2a" stroke="#f5e4b7" stroke-width="2"/><path d="M0 -23 L0 1 M-2 -22 L-2 0 L-20 0 Z" fill="#f8e5bd" stroke="#4e4334" stroke-width="1.5"/><path d="M2 -20 L18 -2 L2 -2 Z" fill="#e7b96d" stroke="#4e4334" stroke-width="1"/><rect x="-18" y="12" width="36" height="16" rx="7" fill="#fff3d5" stroke="#6e5539" stroke-width="1.5"/><text x="-5" y="23" font-size="10" text-anchor="middle" font-weight="bold" fill="#273c3c">${port.type==='any'?'3':'2'}:1</text><text x="16" y="23" font-size="11" text-anchor="middle">${mark}</text>${port.type!=='any'?`<image x="5" y="14" width="19" height="19" href="data:image/svg+xml,${encodeURIComponent(icons[port.type].replace('class="res-icon"',''))}"/>`:''}<title>${port.type==='any'?'Trade any 3 matching resources for 1':`Trade 2 ${port.type} for 1 resource`}</title></g>`}svg.innerHTML=out}
function vertexClick(id){let s=state;if(s.active!==s.you)return;if(s.phase==='setup'&&s.setupStage==='settlement')previewPlacement('placeVertex',{id},'settlement');else if(s.phase==='build'&&s.pendingBuild!=='road')previewPlacement('buildVertex',{id},s.pendingBuild)}
function edgeClick(id){let s=state;if(s.active!==s.you)return;if(s.phase==='setup'&&s.setupStage==='road')previewPlacement('placeEdge',{id},'road');else if(s.phase==='build'&&s.pendingBuild==='road')previewPlacement('buildEdge',{id},'road');else if(s.phase==='freeRoad')previewPlacement('freeEdge',{id},'free road')}
function previewPlacement(type,data,label){if(pendingPlacement)return;pendingPlacement={type,data};let overlay=document.createElement('div');overlay.id='placementConfirm';overlay.innerHTML=`<div class="placement-dialog"><h3>Place ${esc(label)} here?</h3><p>Confirm this location before placing your piece.</p><button id="applyPlacement">Apply</button> <button id="cancelPlacement">Cancel</button></div>`;document.body.append(overlay);$('applyPlacement').onclick=()=>{let choice=pendingPlacement;pendingPlacement=null;overlay.remove();if(choice)act(choice.type,choice.data)};$('cancelPlacement').onclick=()=>{pendingPlacement=null;overlay.remove()};}

function moveToBody(el){if(el.parentElement===document.body)return;const r=el.getBoundingClientRect();document.body.appendChild(el);el.style.position='fixed';el.style.left=r.left+'px';el.style.top=r.top+'px';el.style.right='auto';el.style.bottom='auto';el.style.zIndex='40'}
for(const id of panelIds){const el=$(id);let drag=null;el.addEventListener('pointerdown',e=>{if(e.target.closest('button,input,select,.dev-card-name'))return;if(e.pointerType==='mouse'&&e.button!==0)return;moveToBody(el);const r=el.getBoundingClientRect();drag={x:e.clientX,y:e.clientY,left:r.left,top:r.top};el.setPointerCapture(e.pointerId);});el.addEventListener('pointermove',e=>{if(!drag)return;el.style.left=drag.left+e.clientX-drag.x+'px';el.style.top=drag.top+e.clientY-drag.y+'px'});for(const event of ['pointerup','pointercancel','lostpointercapture'])el.addEventListener(event,()=>drag=null)}

let panPointer=null,ignoreClickUntil=0;
$('board').addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'&&e.button!==0)return;if(e.target!==$('board'))return;panPointer={id:e.pointerId,x:e.clientX,y:e.clientY,moved:false}});
