<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hex Harbors</title><style>
*{box-sizing:border-box}body{margin:0;background:#0c2432;color:#f7eed8;font-family:system-ui,Arial}button,select,input{font:inherit;border-radius:8px;padding:9px;border:1px solid #567;max-width:100%}button{cursor:pointer;background:#f1c46c;color:#132b37;font-weight:700}button:disabled{opacity:.4;cursor:not-allowed}input,select{background:#203d4c;color:white}#home{max-width:540px;margin:12vh auto;padding:28px;background:#193948;border-radius:18px}h1{color:#ffd782}#game{display:none}header{display:flex;align-items:center;gap:12px;padding:10px 18px;background:#142e3c;flex-wrap:wrap}main{display:flex;min-height:calc(100vh - 135px);gap:12px;padding:12px}#boardwrap{flex:1;min-width:0;background:radial-gradient(#227a9b,#10516d);border-radius:16px;overflow:hidden;display:grid;place-items:center}svg{width:100%;height:100%;max-height:78vh;touch-action:manipulation}#side{width:310px;max-height:78vh;overflow:auto;background:#193948;border-radius:14px;padding:15px}#resources{position:sticky;bottom:0;display:flex;justify-content:center;gap:18px;flex-wrap:wrap;padding:15px;background:#142e3c;font-size:18px}#score{position:fixed;left:18px;top:80px;background:#0d2938ed;border:1px solid #d5ad64;border-radius:12px;padding:12px;z-index:4;min-width:200px;cursor:move}#score h3{margin:0 0 6px}.row{padding:5px;border-bottom:1px solid #456}.mine{background:#34566a}.panel{padding:12px;margin:10px 0;border:1px solid #4c7180;border-radius:10px}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}.tiny{font-size:12px;color:#c2d4d8}.hex{stroke:#dfc995;stroke-width:3}.node{cursor:pointer}.edge{cursor:pointer}#message{color:#ffbba6}#log{font-size:12px;max-height:160px;overflow:auto}#log div{padding:4px;border-bottom:1px solid #456}@media(max-width:800px){main{flex-direction:column}#boardwrap{height:56vh;flex:none}#side{width:100%;max-height:none}#score{font-size:12px;min-width:140px;top:62px}header{font-size:14px}}

</style></head><body><section id="home"><h1>⬡ Hex Harbors</h1><p>Online multiplayer hex-trading strategy game · 2–6 players</p><input id="name" placeholder="Your name" maxlength="16"><div class="actions"><button onclick="create()">Create Room</button></div><hr><input id="code" placeholder="Room code"><button onclick="join()">Join Room</button><p id="error"></p></section><section id="game"><header><b>⬡ HEX HARBORS</b><span id="room"></span><span id="status" role="status" aria-live="polite"></span><button onclick="toggleScore()">Scoreboard</button></header><div id="activity" role="status" aria-live="polite"></div><main><aside id="logpanel"><h3>📜 Game Log</h3><div id="log"></div><div id="portlegend">⛵ Ports: 3:1 any resource · 2:1 shown resource</div></aside><div id="boardwrap"><svg id="board" viewBox="-410 -365 820 730"></svg><div id="devInventory" class="movable-panel"></div><div id="pieceInventory" class="movable-panel"></div><div id="recipeBar"></div></div><aside id="side"></aside></main><div id="resources"></div><div id="score"><h3>☷ Scoreboard</h3><div id="scores"></div></div></section><script src="/socket.io/socket.io.js"></script><script>
const socket=io(),$=id=>document.getElementById(id),R=['brick','wood','wool','wheat','ore'],icons={brick:'🧱',wood:'🪵',wool:'🐑',wheat:'🌾',ore:'🪨'},colors={Red:'#e94745',Orange:'#f39b3b',Green:'#39bf72',Blue:'#4298f5',Purple:'#ad75f3',White:'#ffffff'},fill={hill:'#b86639',forest:'#1c6940',pasture:'#8ec95b',field:'#e5c154',mountain:'#89979c',desert:'#e7cb8b'};let state,me,token=localStorage.getItem('hex-token')||crypto.randomUUID();localStorage.setItem('hex-token',token);let dragging=false;let lastEvent='';let scorePositioned=false;function positionScore(){if(scorePositioned)return;let b=$('boardwrap').getBoundingClientRect();if(!b.width)return;$('score').style.left=Math.round(b.left+12)+'px';$('score').style.top=Math.round(b.top+12)+'px';scorePositioned=true;}
function create(){socket.emit('create',{name:$('name').value,token})}function join(){socket.emit('join',{name:$('name').value,code:$('code').value,token})}function act(type,data={}){socket.emit('act',{type,data})}socket.on('errorMessage',s=>{if(state)alert(s);else $('error').textContent=s});socket.on('kicked',()=>location.reload());socket.on('privateNotice',msg=>{window.privateNoticeUntil=Date.now()+6500;let el=$('activity');el.textContent=msg;el.classList.add('visible');clearTimeout(window.activityTimer);window.activityTimer=setTimeout(()=>el.classList.remove('visible'),6500);});socket.on('state',s=>{state=s;me=s.players.find(p=>p.id===s.you);$('home').style.display='none';$('game').style.display='block';render();positionScore()});
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const button=(label,fn)=>`<button onclick="${fn}">${label}</button>`;function selectRes(id){return `<select id="${id}">${R.map(x=>`<option value="${x}">${icons[x]} ${x}</option>`).join('')}</select>`}function get(id){return $(id)?.value}
function render(){let s=state,active=s.active===s.you,p=s.players.find(x=>x.id===s.active);$('room').textContent=`Room: ${s.code}`;$('status').textContent=`${s.phase.toUpperCase()} · ${p?.name||''}${s.roll?' · 🎲 '+s.roll.n:''}`;$('resources').innerHTML=R.map(k=>`<span>${icons[k]} ${esc(k)}: <b>${me.resources[k]}</b></span>`).join('');$('scores').innerHTML=[...s.players].sort((a,b)=>score(b)-score(a)).map((x,i)=>`<div class="row ${x.id===s.you?'mine':''}"><b style="color:${colors[x.color]}">●</b> ${i+1}. ${esc(x.name)} · ${score(x)} VP <small>(${x.resourceTotal} cards: ${x.cardCount})</small></div>`).join('');let latest=s.log?.[0]||'';if(latest!==lastEvent){lastEvent=latest;if(Date.now()< (window.privateNoticeUntil||0)){}else{let el=$('activity');el.textContent=latest;el.classList.add('visible');clearTimeout(window.activityTimer);window.activityTimer=setTimeout(()=>el.classList.remove('visible'),4500)}}$('log').innerHTML=(s.log||[]).map((x,i)=>`<div>${i===0?'✦ ':''}${esc(x)}</div>`).join('');let h='';if(s.phase==='lobby'){h=`<h2>Lobby (${s.players.length}/6)</h2>${s.players.map(x=>`<div class="row">${esc(x.name)} · ${x.color} ${s.isHost&&x.id!==s.you?button('Remove',`act('remove',{id:'${x.id}'})`):''}</div>`).join('')}<p>Choose color</p><select onchange="act('color',{color:this.value})">${Object.keys(colors).map(c=>`<option ${me.color===c?'selected':''} ${s.players.some(x=>x.color===c&&x.id!==s.you)?'disabled':''}>${c}</option>`).join('')}</select>${s.isHost&&s.players.length>=2?button('Start Game',"act('start')"):''}`}
else{h=`<div id="turnguide">${active?'🟢 YOUR TURN':'⏳ '+esc(p?.name||'Player')+' is playing'} · ${esc(s.phase.replace(/([A-Z])/g,' $1').toUpperCase())}</div><h3>${esc(p?.name)}'s turn</h3><p class="tiny">${s.phase==='setup'?'Place '+s.setupStage+' · Round '+(s.setupStep<s.players.length?1:2):''}</p>`;if(s.phase==='rolloff'){let ro=s.rolloff,eligible=ro.contenders.includes(s.you),rolled=ro.rolls[s.you];h+=`<div class="panel"><h3>🎲 Starting Roll-Off · Round ${ro.round}</h3><p>Everyone rolls two dice. Highest total starts. If highest is tied, only tied players roll again.</p>${s.players.map(x=>`<div class="row">${esc(x.name)}: ${ro.rolls[x.id]?`🎲 ${ro.rolls[x.id].a} + ${ro.rolls[x.id].b} = <b>${ro.rolls[x.id].n}</b>`:ro.contenders.includes(x.id)?'⏳ Waiting to roll':'— Not in tie-break'}</div>`).join('')}${eligible&&!rolled?button('🎲 Roll for First Player',"act('rolloffRoll')"):`<p>${eligible?'Waiting for other players…':'Waiting for tie-break players…'}</p>`}</div>`}if(s.phase==='preroll'&&active){h+=button('🎲 Roll Dice',"act('roll')");}if(s.phase==='action'&&active){h+=`<div class="panel"><b>Supply Trade</b><p>Give ${selectRes('give')} for ${selectRes('get')}</p>${button('Trade',"act('tradeBank',{give:get('give'),get:get('get')})")}</div>`;h+=`<div class="panel"><b>Offer Player Trade</b><p>To <select id="target">${s.players.filter(x=>x.id!==s.you).map(x=>`<option value="${x.id}">${({Red:"🔴",Orange:"🟠",Green:"🟢",Blue:"🔵",Purple:"🟣",White:"⚪"}[x.color]||"●")} ${esc(x.name)}</option>`).join('')}</select></p><p>Give ${selectRes('offerGive')} <input id="giveN" type="number" value="1" min="1" style="width:65px"></p><p>Get ${selectRes('offerGet')} <input id="getN" type="number" value="1" min="1" style="width:65px"></p>${button('Send Offer',"sendOffer()")}</div>`;}
if(s.offer?.to===s.you){let o=s.offer,from=s.players.find(x=>x.id===o.from);h+=`<div class="panel"><b>Trade offer from ${({Red:"🔴",Orange:"🟠",Green:"🟢",Blue:"🔵",Purple:"🟣",White:"⚪"}[from?.color]||"●")} ${esc(from?.name)}</b><p>You give ${esc(JSON.stringify(o.get))} and receive ${esc(JSON.stringify(o.give))}</p>${button('Accept',"act('answerOffer',{accept:true})")}${button('Decline',"act('answerOffer',{accept:false})")}</div>`}if(s.phase==='discard'&&s.discard[s.you]){h+=`<div class="panel">Discard exactly ${s.discard[s.you]} resources.${R.map(k=>`<p>${icons[k]} ${k} <input id="discard-${k}" type="number" value="0" min="0" max="${me.resources[k]}" style="width:80px"></p>`).join('')}${button('Discard',"discard()")}</div>`}if(s.phase==='robberTarget'&&s.robberActor===s.you){h+='<div class="panel">Choose player to rob: '+s.players.filter(x=>x.id!==s.you).map(x=>button(x.name,`act('steal',{id:'${x.id}'})`)).join('')+'</div>'}if(s.phase==='robberMove'&&s.robberActor===s.you)h+='<p>☠ Click a different tile to move the robber.</p>';if(s.phase==='setup'&&active)h+='<p>Click a highlighted vertex or edge to place your piece.</p>';if(s.phase==='build'&&active)h+=`<p>Click a vertex or edge to place your purchased ${s.pendingBuild}.</p>`;if(s.phase==='freeRoad'&&active)h+='<p>Place your free roads.</p>';if(s.phase==='won')h+=`<h2>🎉 ${esc(s.players.find(x=>x.id===s.winner)?.name)} wins! 🎉</h2>`;}let ports=(s.board?.ports||[]).filter(port=>s.buildings?.[port.vertex]?.owner===s.you).map(x=>x.type);let portNames=[...new Set(ports)].map(x=>x==='any'?'⚓ 3:1 any resource':`${icons[x]} 2:1 ${x}`).join(' · ');if(s.phase!=='lobby')h=`<div id="lastCollection"><b>💰 Last Collection</b><div>${Object.entries(me.lastGain||{}).map(([k,n])=>`${icons[k]} ${n}`).join(', ')||'None'}</div></div><div id="portStatus"><b>⛵ Active Ports:</b> ${portNames||'None (4:1 supply trading)'}</div>`+h;$ ('side').innerHTML=h;let ownBuildings=Object.values(s.buildings||{}).filter(b=>b.owner===s.you),roadCount=Object.values(s.roads||{}).filter(x=>x===s.you).length;let settlements=ownBuildings.filter(b=>b.type==='settlement').length,cities=ownBuildings.filter(b=>b.type==='city').length;$('pieceInventory').innerHTML=`<h4>🏗 Pieces Available</h4>🔺 Settlements: ${5-settlements}/5<br>🏠 Cities: ${4-cities}/4<br>━ Roads: ${15-roadCount}/15`;$('devInventory').innerHTML='<h4>🃏 Development Cards ('+me.cards.length+')</h4>'+me.cards.map(c=>`<div class="row">${esc(c.type)} ${s.phase==='preroll'&&active?button('Play',`playCard('${c.id}','${c.type}')`):''}</div>`).join('');let costs={road:'🧱🪵',settlement:'🧱🪵🐑🌾',city:'🌾🌾🪨🪨🪨',card:'🐑🌾🪨'};$('recipeBar').innerHTML=Object.entries(costs).map(([k,v])=>`<div>${k[0].toUpperCase()+k.slice(1)} ${v}</div>`).join('');if(s.phase==='action'&&active){$('side').insertAdjacentHTML('beforeend',`<div class="panel"><h3>🏗 Build</h3><div class="actions">${Object.keys(costs).map(k=>button(k==='card'?'Development Card':k[0].toUpperCase()+k.slice(1),`act('buy',{item:'${k}'})`)).join('')}</div></div>`);$('side').insertAdjacentHTML('beforeend',`<div class="end-turn-section">${button('End Turn',"act('pass')")}</div>`)}draw()}
function score(p){return Object.values(state.buildings||{}).filter(b=>b.owner===p.id).reduce((a,b)=>a+(b.type==='city'?2:1),0)+(p.playedVP||0)+(state.longest===p.id?2:0)+(state.largest===p.id?2:0)}function sendOffer(){let give={[get('offerGive')]:Number(get('giveN'))},getR={[get('offerGet')]:Number(get('getN'))};act('offer',{to:get('target'),give,get:getR})}function discard(){act('discard',{resources:Object.fromEntries(R.map(k=>[k,Number(get('discard-'+k))]))})}function playCard(id,type){let data={id};if(type==='Invention'){let a=prompt('First resource: '+R.join(', '));let b=prompt('Second resource: '+R.join(', '));data.picks=[a,b]}if(type==='Monopoly')data.resource=prompt('Resource: '+R.join(', '));act('card',data)}
function draw(){let s=state,svg=$('board');if(!s.board){svg.innerHTML='';return}let out=`<defs>
<pattern id="forestTex" width="30" height="30" patternUnits="userSpaceOnUse"><circle cx="9" cy="9" r="9" fill="#104c32"/><circle cx="24" cy="22" r="10" fill="#2a8050"/><circle cx="16" cy="2" r="5" fill="#397b44"/></pattern>
<pattern id="pastureTex" width="26" height="26" patternUnits="userSpaceOnUse"><path d="M2 23l3-8 3 8M14 12l3-7 3 7M21 25l2-6" stroke="#4f993f" stroke-width="1.8" fill="none"/><circle cx="9" cy="5" r="2" fill="#d6df72"/></pattern>
<pattern id="fieldTex" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M4 24V2m0 6-3-3m3 9 4-4m9 14V0m0 8-3-4m3 12 4-5" stroke="#b88e32" stroke-width="2" fill="none"/><path d="M9 0v24" stroke="#ffe18a" stroke-width="2"/></pattern>
<pattern id="hillTex" width="36" height="28" patternUnits="userSpaceOnUse"><path d="M0 12Q9 -2 18 12T36 12M-8 26Q4 13 16 26T40 26" stroke="#8d432b" stroke-width="7" fill="none"/><path d="M0 11Q9 0 18 11T36 11" stroke="#e99a55" stroke-width="3" fill="none"/></pattern>
<pattern id="mountainTex" width="42" height="34" patternUnits="userSpaceOnUse"><path d="M-8 32L9 5l16 27M9 32L27 0l19 32" fill="#667980" stroke="#b4c3c0" stroke-width="2"/><path d="M3 15l6-10 7 12-7-3zM21 12l6-12 8 15-8-5z" fill="#e3e9e4"/></pattern>

</defs>`;let textures={hill:'hillTex',forest:'forestTex',pasture:'pastureTex',field:'fieldTex',mountain:'mountainTex',desert:'desertTex'};for(let [i,t] of s.board.tiles.entries()){let pts=Array.from({length:6},(_,k)=>{let a=(k*60-30)*Math.PI/180;return `${t.x+55*Math.cos(a)},${t.y+55*Math.sin(a)}`}).join(' ');out+=`<polygon class="hex" points="${pts}" fill="${fill[t.type]}" onclick="act('robber',{index:${i}})"/><polygon class="hex" points="${pts}" fill="url(#${textures[t.type]})" opacity=".8" onclick="act('robber',{index:${i}})"/>`;if(t.number){let n=t.number,dots=6-Math.abs(7-n);out+=`<circle cx="${t.x}" cy="${t.y+8}" r="19" fill="#f8eed4" stroke="#796e4d" pointer-events="none"/><text x="${t.x}" y="${t.y+9}" font-size="17" text-anchor="middle" fill="${n===6||n===8?'#d52e22':'#282621'}" font-weight="bold">${n}</text><text x="${t.x}" y="${t.y+21}" text-anchor="middle" font-size="7" fill="#333">${'●'.repeat(dots)}</text>`}if(s.robber===i)out+=`<circle cx="${t.x}" cy="${t.y}" r="23" fill="#151d26" stroke="#fff0bc" stroke-width="3" pointer-events="none"/><text x="${t.x}" y="${t.y+10}" font-size="29" text-anchor="middle" fill="#fff">☠</text>`}
for(let e of Object.values(s.board.edges)){let a=s.board.vertices[e.a],b=s.board.vertices[e.b],owner=s.roads?.[e.id],color=owner?colors[s.players.find(p=>p.id===owner)?.color]:'#ffffff55';out+=`<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="${color}" stroke-width="${owner?9:4}" stroke-linecap="round" onclick="edgeClick('${e.id}')"/><line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="transparent" stroke-width="18" onclick="edgeClick('${e.id}')"/>`}

function vertexClick(id){let s=state;if(s.phase==='setup'&&s.active===s.you&&s.setupStage==='settlement')act('placeVertex',{id});else if(s.phase==='build'&&s.active===s.you)act('buildVertex',{id})}function edgeClick(id){let s=state;if(s.phase==='setup'&&s.active===s.you&&s.setupStage==='road')act('placeEdge',{id});else if(s.phase==='build'&&s.active===s.you)act('buildEdge',{id});else if(s.phase==='freeRoad'&&s.active===s.you)act('freeEdge',{id})}function toggleScore(){$('score').hidden=!$('score').hidden}// Floating inventories: drag from their header; retain location between re-renders.
for(const id of ['devInventory','pieceInventory']){
 const el=$(id);let origin=null;

 el.addEventListener('pointermove',e=>{if(!origin)return;const parent=$('boardwrap');const left=Math.max(0,Math.min(parent.clientWidth-el.offsetWidth,origin.left+e.clientX-origin.x));const top=Math.max(0,Math.min(parent.clientHeight-el.offsetHeight,origin.top+e.clientY-origin.y));el.style.left=left+'px';el.style.top=top+'px';});
 const end=()=>{origin=null};el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end);
}
